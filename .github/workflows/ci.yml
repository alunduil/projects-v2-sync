---
name: CI

# Every job that runs on an integration event.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs; never cancel a push to main, so every
  # commit on it keeps a result of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hooks:
    name: Run pre-commit hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The local hooks run from node_modules.
      - uses: ./.github/actions/setup-node-pnpm

      - name: Run hooks
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          # The bundle job reports a stale dist/.
          SKIP: build
        with:
          prek-version: 'v0.5.10'

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Test
        run: pnpm run test

  # A squash merge takes the PR title as its commit subject, so this check
  # gates what reaches main. The default type list matches the
  # conventional-pre-commit hook's.
  #
  # Editing the title alone doesn't rerun the check; push or re-run it.
  pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      - name: Validate the title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependency review compares a pull request's base and head; a push has none.
  dependency-review:
    name: Review dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # A Node action runs the committed bundle, so a source change that never
  # reached dist/ ships nothing. Rebuilding and diffing is what catches it.
  bundle:
    name: Bundle is current
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Rebuild the bundle
        run: pnpm run build

      - name: Fail if dist/ differs from the rebuild
        run: |
          set -euo pipefail
          if ! git diff --exit-code --stat -- dist/; then
            echo "::error::dist/ is stale. Run 'pnpm run build' and commit the result."
            exit 1
          fi

  # Nothing else here proves the bundle loads: the other jobs run the sources,
  # and the bundle's CommonJS interop can only fail at runtime.
  action:
    name: Action loads and exits clean
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write a spec fixture
        run: echo '{"owner":"alunduil","title":"Inbox"}' > "${RUNNER_TEMP}/spec.json"

      # The action makes no API calls, so this value is never transmitted.
      - name: Run the action
        uses: ./
        with:
          spec: ${{ runner.temp }}/spec.json
          token: placeholder-until-the-reconciler-lands

  # No other job executes daily.yml, so the dry run is the only test of a
  # runner image or action update to it before merge. Its job only reads,
  # so running it on a pull request is safe.
  daily-changes:
    name: Detect daily.yml changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ steps.files.outputs.changed }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/files" \
            --jq '.[].filename | select(. == ".github/workflows/daily.yml")')
          echo "changed=$([[ -n $files ]] && echo true || echo false)" >>"${GITHUB_OUTPUT}"

  # daily.yml's jobs get at most this grant; a permission added there needs
  # adding here too.
  dry-run-daily:
    name: Dry-run Daily
    needs: daily-changes
    if: needs.daily-changes.outputs.changed == 'true'
    uses: ./.github/workflows/daily.yml
    permissions:
      issues: read

  # Reports on every pull request, unlike the dry runs it gathers, so branch
  # protection can require it.
  dry-run-results:
    name: Check workflow dry runs
    needs:
      - daily-changes
      - dry-run-daily
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail when any dry run failed or was cancelled
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Renovate commits only the lockfile, so a bundle change needs dist/ rebuilt
  # on its branch.
  fix-renovate-hooks:
    name: Fix hooks on the Renovate branch
    # Renovate updates the pin only through the trailing `# main` comment.
    # yamllint disable-line rule:line-length
    uses: alunduil/renovate-config/.github/workflows/fix-renovate-hooks.yml@3c1c613345255d7ac350a46304085ac298d84eaa # main
    permissions:
      contents: read
      id-token: write
    with:
      node-version-file: .nvmrc
      hook-runner: prek
