extends: default

rules:
  # Workflow YAML carries URLs and SHA pins that shouldn't be wrapped.
  line-length:
    max: 120
    level: warning

  document-start: enable

  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false

  comments:
    min-spaces-from-content: 1
  comments-indentation: disable

  # `on:` is a GitHub Actions trigger key, not a boolean.
  truthy:
    allowed-values: ['true', 'false', 'on']
    check-keys: false

ignore: |
  node_modules/
  dist/
  coverage/
  test-results/
  pnpm-lock.yaml
