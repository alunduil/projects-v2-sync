---
exclude: |
  (?x)^(
    node_modules/.*|
    coverage/.*|
    test-results/.*|
    pnpm-lock\.yaml|
    dist/.*|
    \.vale/styles/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-json
        # tsconfig.json is JSONC by convention, and TypeScript reads the
        # comments fine; this hook's strict parser does not.
        exclude: ^tsconfig\.json$
      - id: check-yaml

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  # The packages .vale.ini declares are vendored under .vale/styles/.
  - repo: https://github.com/errata-ai/vale
    rev: v3.25.1
    hooks:
      - id: vale
        args: [--output=line, --minAlertLevel=error]
        types: [markdown]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ['--strict']

  # actionlint owns workflow validation; yamllint above sees only the YAML.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.192.2
    hooks:
      - id: renovate-config-validator
        args: [--strict, --no-global]

  # REUSE.toml is the only TOML here, and the licensing gate reads it, so a
  # malformed one fails confusingly.
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.9.8
    hooks:
      - id: tombi-format
        args: ['--offline']
      - id: tombi-lint
        args: ['--offline']

  # Every tracked file declares copyright and licence, inline or via
  # REUSE.toml.
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Project-local hooks. Versions come from package.json, and these need
  # `pnpm install` to have populated node_modules.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write
        language: system
        types_or: [javascript, ts, json, yaml, markdown]
      - id: eslint
        # --max-warnings=0 lives in the `lint` script, so the gate and a
        # local `pnpm run lint` cannot disagree about what counts as failure.
        name: eslint
        entry: pnpm run lint
        language: system
        pass_filenames: false
        files: \.(ts|js)$|^eslint\.config\.js$
      - id: typecheck
        # One tsconfig covers src/ and scripts/, so the build script is
        # type-checked and not only linted.
        name: typecheck
        entry: pnpm run typecheck
        language: system
        pass_filenames: false
        types: [ts]
      - id: build
        # The top-level exclude hides pnpm-lock.yaml from a files filter, and
        # the build is fast enough to run on every commit.
        name: build
        entry: pnpm run build
        language: system
        pass_filenames: false
        always_run: true
