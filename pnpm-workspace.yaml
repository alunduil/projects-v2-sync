---
# Not a workspace: pnpm reads its settings from this file, not package.json.

# esbuild's postinstall fetches its platform binary, so the bundler cannot run
# without it.
allowBuilds:
  esbuild: true

# Renovate's lock file maintenance skips its release-age wait, so pnpm enforces
# one on every version. 4320 minutes is three days, matching
# alunduil/renovate-config.
minimumReleaseAge: 4320
