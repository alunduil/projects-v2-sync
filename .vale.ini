StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Microsoft, proselint, alex

[*.md]
BasedOnStyles = Vale, Microsoft, proselint, alex
# Duplicates Microsoft.Terms.
proselint.Cliches = NO
# Duplicates Vale.Spelling.
proselint.Spelling = NO

# AI instruction files: spelling and terminology, no voice rules. BasedOnStyles
# replaces the inherited list rather than extending it. A new instruction file
# belongs in this glob; left to the default it lints for prose voice, and the
# findings won't say why.
[{AGENTS.md,CLAUDE.md}]
BasedOnStyles = Vale
